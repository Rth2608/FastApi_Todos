# 최상단 version 키는 Compose Spec 에서 폐기되었습니다 (Compose V2 에서 경고 발생) → 삭제
services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app
    ports:
      - "5002:8000"
    environment:                  # ← #9 추가
      - PYTHONUNBUFFERED=1        # 로그를 버퍼링 없이 바로 stdout으로 출력
    networks:
      - loadtest-net

  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter
    volumes:
      - ./jmeter:/jmeter
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /jmeter/results.jtl
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -Jjmeter.save.saveservice.output_format=csv
      - -e
      - -o
      - /jmeter/report
    networks:
      - loadtest-net

  sonarqube:
    # latest 태그는 재현이 안 되고, 어느 날 메이저 업그레이드가 끼어들어 DB 마이그레이션이 터집니다.
    # Community Build 최신 버전으로 고정 (2026-11 기준)
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    ports:
      # 0.0.0.0 바인딩 금지. 인증 없는 관리 UI 가 전 인터넷에 열립니다.
      # 접속은 SSH 터널(ssh -L 9000:127.0.0.1:9000 ...) 또는 역방향 프록시로
      - "127.0.0.1:9000:9000"
    environment:
      # 학습 환경 편의용입니다. 운영에서는 호스트의 vm.max_map_count 를 올리고 이 옵션은 끌 것
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - loadtest-net

  prometheus:
    image: prom/prometheus:v3.15.1   # 최신 안정 버전 고정 (LTS 가 필요하면 v3.13.5)
    container_name: prometheus
    volumes:
      # 설정 파일은 읽기 전용으로 마운트
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:7070:9090"   # 외부 노출 금지
    networks:
      - loadtest-net

  grafana:
    image: grafana/grafana:13.3.0   # 최신 안정 버전 고정
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"   # 외부 노출 금지
    environment:
      # admin/admin 을 평문으로 박아두면 포트가 열리는 순간 바로 관리자 계정이 털립니다.
      # 비밀번호는 git 에 올라가지 않는 .env 파일에 두고 참조하세요. (.gitignore 에 .env 추가 필수)
      #   .env  예)  GRAFANA_ADMIN_PASSWORD=<직접 만든 긴 랜덤 문자열>
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 설정하세요}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - loadtest-net

  node-exporter:
    image: prom/node-exporter:v1.12.1   # 최신 안정 버전 고정
    container_name: node-exporter
    ports:
      # node-exporter 는 인증이 전혀 없고 호스트의 CPU/메모리/네트워크/마운트 정보를 그대로 뱉습니다.
      # 외부에 열어두면 정찰(recon) 과 증폭 공격의 표적이 됩니다. 반드시 루프백에만 바인딩
      - "127.0.0.1:7100:9100"
    networks:
      - loadtest-net

  loki:                           # ← #9 추가: 로그 저장소
    image: grafana/loki:3.7.9     # 최신 안정 버전 고정 (2026-11 기준)
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml   # 이미지 기본 설정 (TSDB + schema v13)
    ports:
      - "127.0.0.1:3100:3100"     # 외부 노출 금지 (이 설정의 Loki는 인증이 없음)
    volumes:
      - loki-data:/loki           # 수집된 로그 보존 (컨테이너를 다시 만들어도 유지)
    networks:
      - loadtest-net

  alloy:                          # ← #9 추가: 로그 수집기 (Promtail 대체)
    image: grafana/alloy:v1.21.3  # 최신 안정 버전 고정 (Alloy 태그는 앞에 v가 붙음)
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345   # 컨테이너 밖(아래 ports)에서 Alloy UI에 접속할 수 있게
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI. 외부 노출 금지 (로그인 기능 없음)
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 컨테이너 목록·로그를 읽는 통로
      - alloy-data:/var/lib/alloy/data                 # 어디까지 읽었는지(positions) 저장
    depends_on:
      - loki
    networks:
      - loadtest-net

networks:
  loadtest-net:
    driver: bridge

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  grafana-data:
  loki-data:                      # ← #9 추가
  alloy-data:                     # ← #9 추가